name: CD Production (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ対象'
        type: choice
        options:
          - backend
          - web
          - both
        required: true
      confirm:
        description: '本番デプロイを確認するために "deploy" と入力してください'
        type: string
        required: true

jobs:
  deploy-backend-production:
    if: inputs.environment == 'backend' || inputs.environment == 'both'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
      deployments: write
    steps:
      - name: 確認文字列バリデーション
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "確認文字列が不正です。\"deploy\" と入力してください。"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/backend/go.sum
      - name: AWS 認証（OIDC）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Lambda 用バイナリをビルド
        run: cd apps/backend && make zip
      - name: Lambda 関数を更新
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.AWS_LAMBDA_PROD_FUNCTION_NAME }} \
            --zip-file fileb://apps/backend/function.zip
      - name: Deployment API に完了を記録
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'バックエンド本番デプロイ完了',
              auto_merge: false,
              required_contexts: [],
            }).then(async (res) => {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: res.data.id,
                state: 'success',
                environment: 'production',
              });
            });

  deploy-web-production:
    if: inputs.environment == 'web' || inputs.environment == 'both'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      deployments: write
    steps:
      - name: 確認文字列バリデーション
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "確認文字列が不正です。\"deploy\" と入力してください。"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: 依存関係インストール
        run: npm ci
      - name: Vercel 設定を取得
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
      - name: 本番ビルド
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
      - name: 本番デプロイ
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "production_url=$url" >> $GITHUB_OUTPUT
        working-directory: apps/web
      - name: デプロイ URL を表示
        run: echo "本番 URL ${{ steps.deploy.outputs.production_url }}"
      - name: Deployment API に完了を記録
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Web 本番デプロイ完了',
              auto_merge: false,
              required_contexts: [],
            }).then(async (res) => {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: res.data.id,
                state: 'success',
                environment: 'production',
                environment_url: '${{ steps.deploy.outputs.production_url }}',
              });
            });
